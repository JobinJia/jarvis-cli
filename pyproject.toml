[project]
name = "jarvis-cc"
version = "0.1.0"
description = "Jarvis-voiced notification layer for Claude Code"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jobin" }]
dependencies = [
    "httpx>=0.27",
    "loguru>=0.7",
    "langdetect>=1.0.9",
    "coqui-tts[codec]>=0.24",
]

[project.optional-dependencies]
# XTTS-v2 needs the PyTorch runtime. Kept optional so users on the
# ElevenLabs / `say` paths don't pull ~300MB they won't load.
#
# transformers is pinned <5 because coqui-tts 0.27.x still imports
# `isin_mps_friendly` from `transformers.pytorch_utils`, which was
# removed in transformers 5.0. Upstream coqui-tts has not adapted yet.
xtts = [
    "torch>=2.2",
    "torchaudio>=2.2",
    "transformers>=4.57,<5",
]

[project.scripts]
jarvis-cc = "jarvis_cc.install:main"
jarvis-cc-hook = "jarvis_cc.hook_client:main"
jarvis-cc-daemon = "jarvis_cc.daemon.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_cc"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
